# Self-hosted LMS Assignment Automation: one stack per student.
# This branch is for a Coolify server that already runs PostgreSQL and Evolution API: it bundles
# neither. Set DATABASE_URL, EVOLUTION_API_URL, EVOLUTION_API_KEY and API_INTERNAL_URL.
# Deploy it as a Docker Compose resource; values come from the resource's environment variables.
#
# The worker polls the LMS, logs in, uploads and deletes. The api answers your WhatsApp and
# Discord messages through the menu, reads lecture notes, plans and outlines from the LMS with
# the worker's session, and serves the setup page (/setup): give it a domain (port 8000; on Coolify, in the
# api service's Domains), open it, sign Claude in and link WhatsApp there. Nothing else is
# reachable from outside. Each assignment is solved in a throwaway container from the
# solver image, started through the Docker socket proxy, on its own network, which the worker
# makes: the internet, but none of this stack's services.

services:
  worker:
    build: ./worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL}
      - APP_SECRET_KEY=${APP_SECRET_KEY:?set APP_SECRET_KEY}
      - CMS_ENROLLMENT=${CMS_ENROLLMENT:?set CMS_ENROLLMENT}
      - CMS_PASSWORD=${CMS_PASSWORD:?set CMS_PASSWORD}
      - CMS_INSTITUTE=${CMS_INSTITUTE:-Karachi Campus}
      - CMS_ROLE=${CMS_ROLE:-Student}
      # WhatsApp: an Evolution API running outside this stack (this branch bundles none)
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-lms}
      - WHATSAPP_NUMBER=${WHATSAPP_NUMBER:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Solving: sandbox containers through the socket proxy, under the claude.ai login
      - DOCKER_HOST=tcp://docker-proxy:2375
      - SOLVER_IMAGE=lms-solver:latest
      - SOLVER_NETWORK=lms-sandbox
      - SOLVER_DAILY_CAP=${SOLVER_DAILY_CAP:-6}
      - SOLVER_PAUSE_AT=${SOLVER_PAUSE_AT:-0.8}
      - SOLVER_MODEL=${SOLVER_MODEL:-}
      - TZ=Asia/Karachi
    volumes:
      - artifacts:/data
      - claude-home:/claude-home
    networks: [default, coolify]
    depends_on:
      docker-proxy:
        condition: service_started
      solver-image:
        condition: service_started

  # Answers WhatsApp messages through the numbered menu; same image as the worker
  api:
    build: ./worker
    restart: unless-stopped
    command: ["sh", "-c", "lms-worker db-upgrade && exec lms-worker api"]
    environment:
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL}
      - APP_SECRET_KEY=${APP_SECRET_KEY:?set APP_SECRET_KEY}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-lms}
      - WHATSAPP_NUMBER=${WHATSAPP_NUMBER:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      # Where Evolution API reaches this api; set it when Evolution runs outside this stack
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://api:8000}
      # The setup page's password; the page is closed without one
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - TZ=Asia/Karachi
    volumes:
      # Writable: files you send in the chat, and lectures fetched for you, are kept here
      - artifacts:/data
      - claude-home:/claude-home
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [default, coolify]

  # Starts solver containers for the worker. Only container, image and network calls are allowed.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Builds the lms-solver image on every deploy, then idles, on no network. Solver containers
  # are started from that image on their own network (SOLVER_NETWORK): the internet, but not
  # the shared PostgreSQL, the Docker proxy or WhatsApp. The worker makes that network and it
  # is deliberately not declared in this file: Coolify attaches its proxy to every network one
  # of its containers is on, which put the proxy next to the solver, and then no deploy could
  # change the network because the proxy was still on it.
  solver-image:
    build: ./sandbox
    image: lms-solver:latest
    restart: unless-stopped
    command: ["sleep", "infinity"]
    network_mode: none

volumes:
  artifacts:
  # The claude.ai login: the setup page signs in here, solver containers mount it as their home.
  # Without a domain: docker compose exec worker env HOME=/claude-home claude auth login --claudeai
  claude-home:
    name: lms-claude-home

networks:
  # Coolify's shared network, where the shared PostgreSQL lives
  coolify:
    external: true
