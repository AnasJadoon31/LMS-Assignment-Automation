# Self-hosted LMS Assignment Automation: one stack per student.
# Works with `docker compose up -d` on any machine, or as a Docker Compose resource on Coolify.
# Values come from .env (plain Docker) or the resource's environment variables (Coolify).
#
# Only the worker talks to the LMS. The api answers your WhatsApp messages through the
# menu and serves the setup page (/setup): give it a domain (port 8000; on Coolify, in the
# api service's Domains), open it, sign Claude in and link WhatsApp there. Nothing else is
# reachable from outside. Each assignment is solved in a throwaway container from the
# solver image, started through the Docker socket proxy, with the internet only through the
# egress proxy's allowlist.

services:
  worker:
    build: ./worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://lms:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/lms
      - APP_SECRET_KEY=${APP_SECRET_KEY:?set APP_SECRET_KEY}
      - CMS_ENROLLMENT=${CMS_ENROLLMENT:?set CMS_ENROLLMENT}
      - CMS_PASSWORD=${CMS_PASSWORD:?set CMS_PASSWORD}
      - CMS_INSTITUTE=${CMS_INSTITUTE:-Karachi Campus}
      - CMS_ROLE=${CMS_ROLE:-Student}
      # WhatsApp: the bundled Evolution API below, unless you point this at your own
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-api:8080}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-lms}
      - WHATSAPP_NUMBER=${WHATSAPP_NUMBER:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Solving: sandbox containers through the socket proxy, under the claude.ai login
      - DOCKER_HOST=tcp://docker-proxy:2375
      - SOLVER_IMAGE=lms-solver:latest
      - SOLVER_NETWORK=lms-sandbox
      - SOLVER_PROXY=http://egress:3128
      - SOLVER_DAILY_CAP=${SOLVER_DAILY_CAP:-6}
      - SOLVER_PAUSE_AT=${SOLVER_PAUSE_AT:-0.8}
      - SOLVER_MODEL=${SOLVER_MODEL:-}
      - TZ=Asia/Karachi
    volumes:
      - artifacts:/data
      - claude-home:/claude-home
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
      egress:
        condition: service_started

  # Answers WhatsApp messages through the numbered menu; same image as the worker
  api:
    build: ./worker
    restart: unless-stopped
    command: ["sh", "-c", "lms-worker db-upgrade && exec lms-worker api"]
    environment:
      - DATABASE_URL=postgresql://lms:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/lms
      - APP_SECRET_KEY=${APP_SECRET_KEY:?set APP_SECRET_KEY}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-api:8080}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-lms}
      - WHATSAPP_NUMBER=${WHATSAPP_NUMBER:-}
      - API_INTERNAL_URL=http://api:8000
      # The setup page's password; the page is closed without one
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - TZ=Asia/Karachi
    volumes:
      - artifacts:/data:ro
      - claude-home:/claude-home
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=lms
      - POSTGRES_DB=lms
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # WhatsApp gateway. The worker creates and links its instance; you never open its pages.
  # It keeps its tables in their own schema (evolution_api) of the same database, and
  # stores no chat history: the bot only needs to send, and later to read your replies.
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    environment:
      - SERVER_URL=http://evolution-api:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://lms:${POSTGRES_PASSWORD}@postgres:5432/lms?schema=evolution_api
      - DATABASE_CONNECTION_CLIENT_NAME=lms_bot
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=false
      - DATABASE_SAVE_MESSAGE_UPDATE=false
      - DATABASE_SAVE_DATA_CONTACTS=false
      - DATABASE_SAVE_DATA_CHATS=false
      - DATABASE_SAVE_DATA_LABELS=false
      - DATABASE_SAVE_DATA_HISTORIC=false
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_LOCAL_ENABLED=false
      - DEL_INSTANCE=false
      - CONFIG_SESSION_PHONE_CLIENT=LMS Bot
      - TELEMETRY_ENABLED=false
      - LOG_LEVEL=ERROR,WARN,INFO
      - LOG_BAILEYS=error
      - LANGUAGE=en
    volumes:
      - evolution_instances:/evolution/instances
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:8080/',r=>process.exit(r.statusCode<300?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Starts solver containers for the worker. Only container, image and network calls are allowed.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.3.0
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # The solver image (built here, so every deploy builds it) runs the sandbox's only way out:
  # an HTTPS proxy that lets through Claude, claude.ai (the theme artifact) and PyPI.
  egress:
    build: ./sandbox
    image: lms-solver:latest
    restart: unless-stopped
    command: ["python3", "-m", "lms_sandbox.egress"]
    networks: [default, sandbox]

  # Optional: sign Claude in from a terminal instead of the setup page
  #   docker compose run --rm solver-login
  solver-login:
    image: lms-solver:latest
    profiles: ["tools"]
    command: ["claude", "auth", "login", "--claudeai"]
    volumes:
      - claude-home:/home/solver
    stdin_open: true
    tty: true

volumes:
  pgdata:
  artifacts:
  evolution_instances:
  evolution_redis:
  # The claude.ai login: the api signs in here, solver containers mount it as their home
  claude-home:
    name: lms-claude-home

networks:
  # Solver containers: no route out except the egress proxy
  sandbox:
    name: lms-sandbox
    internal: true
