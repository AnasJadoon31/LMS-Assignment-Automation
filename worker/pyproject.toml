[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lms-worker"
version = "0.1.0"
description = "LMS adapter, orchestrator and renderer for LMS Assignment Automation"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "playwright==1.56.0",
    "python-dotenv>=1.0",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lms-worker = "lms_worker.cli:main"

[tool.setuptools.packages.find]
include = ["lms_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
