[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lms-worker"
version = "0.1.0"
description = "LMS adapter, orchestrator and renderer for LMS Assignment Automation"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "beautifulsoup4>=4.12",
    "cryptography>=42",
    "docker>=7",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "playwright==1.56.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "segno>=1.6",
    "sqlalchemy>=2.0",
    "tzdata",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lms-worker = "lms_worker.cli:main"

[tool.setuptools.packages.find]
include = ["lms_worker*"]

[tool.setuptools.package-data]
"lms_worker.db.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
