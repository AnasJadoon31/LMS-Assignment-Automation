<!-- @dsCard group="Report" height=1123 width=794 subtitle="The cover page of every report" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  /* A4 at 96 px per inch: 794 x 1123; 1 pt = 1.333 px */
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
  .page { position: relative; width: 794px; height: 1123px; background: var(--paper); box-sizing: border-box; padding: 100px 81px 87px; }
  .frame { position: absolute; inset: 32px; border: 3px solid var(--navy); pointer-events: none; }
  .logo { display: block; width: 232px; margin: 33px auto 17px; }
  .uni { font-family: var(--font-serif); font-weight: 700; font-size: 34.67px; letter-spacing: .115em; color: var(--navy); text-align: center; margin: 0 0 3px; }
  .campus { font-size: 16px; letter-spacing: .5em; color: var(--muted); text-align: center; margin: 0 0 4px; }
  .dept { font-size: 17.33px; text-align: center; margin: 0 193px 13px; padding-bottom: 19px; border-bottom: 4px solid var(--gold); }
  .band { margin-top: 47px; background: var(--navy); border-top: 6px solid var(--gold); border-bottom: 6px solid var(--gold); padding: 25px 20px; text-align: center; }
  .band .label { font-size: 14.67px; font-weight: 700; letter-spacing: .545em; color: var(--gold); margin: 0 0 8px; }
  .band .title { font-family: var(--font-serif); font-size: 40px; font-weight: 700; color: var(--paper); margin: 0 0 8px; line-height: 1.15; }
  .band .cap { font-size: 15.33px; color: var(--sky); margin: 0; white-space: pre; }
  table { margin: 60px auto 0; width: 453px; border-collapse: collapse; }
  td { height: 35px; padding: 4px 8px 4px 16px; border-top: 1px solid var(--paper); border-bottom: 1px solid var(--paper); }
  td.k { width: 135px; background: var(--navy); color: var(--paper); font-size: 12px; font-weight: 700; letter-spacing: .167em; text-transform: uppercase; }
  td.v { background: var(--sky); font-size: 16px; padding-left: 17px; }
</style>
</head>
<body>
<div class="page">
  <div class="frame"></div>
  <img class="logo" src="../../assets/Logos/bahria-university.png" alt="Bahria University logo">
  <p class="uni">BAHRIA UNIVERSITY</p>
  <p class="campus">KARACHI CAMPUS</p>
  <p class="dept">Department of Computer Science</p>
  <div class="band">
    <p class="label">LAB REPORT 05</p>
    <p class="title">Greedy and A* Search Algorithm</p>
    <p class="cap">CSL-411 Artificial Intelligence   |   Semester 05</p>
  </div>
  <table>
    <tr><td class="k">Submitted by</td><td class="v"><b>{{STUDENT_NAME}}</b></td></tr>
    <tr><td class="k">Enrollment</td><td class="v">{{ENROLLMENT}}</td></tr>
    <tr><td class="k">Class</td><td class="v">{{CLASS}}</td></tr>
    <tr><td class="k">Course</td><td class="v">CSL-411 Artificial Intelligence</td></tr>
    <tr><td class="k">Date</td><td class="v">3 October 2026</td></tr>
  </table>
</div>
</body>
</html>
